name: DUKD_SwinIR_x2c180s36_c60s24
suffix: ~  # add suffix to saved images
model_type: DUKD
scale: 2
crop_border: ~  # crop border when evaluation. If None, crop the scale pixels
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

datasets:
  test:
    name: Set5
    type: PairedImageDataset
    dataroot_gt: ../drive/MyDrive/div2k_training_data/Set5/image_SRF_2/HR
    dataroot_lq: ../drive/MyDrive/div2k_training_data/Set5/image_SRF_2/LR
    filename_tmpl: '{}_LR'
    io_backend:
      type: disk
  test_1:
   name: Set14
   type: PairedImageDataset
   dataroot_gt: ../drive/MyDrive/div2k_training_data/Set14/HR
   dataroot_lq: ../drive/MyDrive/div2k_training_data/Set14/LR
   filename_tmpl: '{}_LR'
   io_backend:
     type: disk
  test_2:
   name: BSDS100
   type: PairedImageDataset
   dataroot_gt: ../drive/MyDrive/div2k_training_data/BSDS100/HR
   dataroot_lq: ../drive/MyDrive/div2k_training_data/BSDS100/LR
   filename_tmpl: '{}_LR'
   io_backend:
     type: disk



# network structures
network_g:
  type: SwinIR
  upscale: 2
  in_chans: 3
  img_size: 64
  window_size: 8
  img_range: 1.
  embed_dim: 18
  depths: [6, 6, 6, 6]
  num_heads: [6, 6, 6, 6]
  use_checkpoint: true
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

network_t:
  type: SwinIR
  upscale: 2
  in_chans: 3
  img_size: 64
  window_size: 8
  img_range: 1.
  embed_dim: 180
  depths: [6, 6, 6, 6, 6, 6]
  num_heads: [6, 6, 6, 6, 6, 6]
  mlp_ratio: 2
  upsampler: 'pixelshuffle'
  resi_connection: '1conv'

save_img: true

# path
path:
  pretrain_network_g: net_g_22000.pth
  pretrain_network_t: 001_classicalSR_DF2K_s64w8_SwinIR-M_x2.pth
  strict_load_g: true


val:
  save_img: true
  self_ensemble: false
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true